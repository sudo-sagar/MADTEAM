<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi-Agent Dev Team</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, monospace; max-width: 1200px; margin: 30px auto; padding: 0 20px; background: #0f172a; color: #e2e8f0; }
  h1 { color: #38bdf8; }
  h3 { color: #e2e8f0; margin-top: 24px; }
  textarea { width: 100%; padding: 12px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; font-family: monospace; font-size: 14px; }
  button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 15px; }
  button:hover { background: #7dd3fc; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .status.running { background: #f59e0b; color: #0f172a; }
  .status.complete { background: #10b981; color: #0f172a; }
  .status.error { background: #ef4444; color: white; }
  .status.queued { background: #64748b; color: white; }
  .section { margin-top: 30px; }
  .artifact-img { width: 100%; border-radius: 8px; border: 1px solid #334155; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { padding: 8px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tab.active { background: #38bdf8; color: #0f172a; font-weight: 700; }
  .panel { display: none; }
  .panel.active { display: block; }
  pre { background: #0a0f1e; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
  <h1>Multi-Agent Dev Team</h1>
  <p style="color:#94a3b8;">Self-healing AI agents that plan, code, test, verify visually, and scan for security — autonomously.</p>

  <textarea id="req" rows="3" placeholder="e.g., Write a Python function hash_password(password: str) -> str ..."></textarea>
  <br><br>
  <button id="runBtn" onclick="startRun()">Start Run</button>
  <span id="status" style="margin-left: 12px;"></span>

  <div class="section" id="resultSection" style="display:none;">
    <h3>Visual Artifact</h3>
    <div class="tabs">
      <div class="tab active" onclick="showTab('visual')">Visual</div>
      <div class="tab" onclick="showTab('code')">Code</div>
      <div class="tab" onclick="showTab('events')">Event Log</div>
    </div>

    <div id="panel-visual" class="panel active">
      <img id="artifactImg" class="artifact-img" alt="Visual artifact" />
    </div>

    <div id="panel-code" class="panel">
      <pre id="codeContent">Loading...</pre>
    </div>

    <div id="panel-events" class="panel">
      <pre id="eventLog"></pre>
    </div>
  </div>

<script>
const statusEl = document.getElementById('status');
const resultSection = document.getElementById('resultSection');
const artifactImg = document.getElementById('artifactImg');
const codeContent = document.getElementById('codeContent');
const eventLog = document.getElementById('eventLog');

function startRun() {
  const requirement = document.getElementById('req').value.trim();
  if (!requirement) return alert('Please enter a requirement');

  eventLog.textContent = '';
  resultSection.style.display = 'none';
  document.getElementById('runBtn').disabled = true;

  fetch('/api/runs', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({requirement, max_iterations: 3})
  })
  .then(r => r.json())
  .then(data => {
    statusEl.innerHTML = '<span class="status queued">queued</span>';
    subscribeToRun(data.run_id);
  })
  .catch(e => alert('Failed to start: ' + e));
}

function subscribeToRun(runId) {
  const poll = setInterval(() => {
    fetch('/api/runs/' + runId)
      .then(r => r.json())
      .then(run => {
        if (run.status === 'complete' || run.status === 'error') {
          clearInterval(poll);
          statusEl.innerHTML = '<span class="status ' + run.status + '">' + run.status + '</span>';
          document.getElementById('runBtn').disabled = false;
          loadResult(runId);
        }
      })
      .catch(e => console.error('Poll error:', e));
  }, 1000);
}

function loadResult(runId) {
  resultSection.style.display = 'block';
  artifactImg.src = '/artifact/' + runId + '?t=' + Date.now();

  fetch('/api/runs/' + runId)
    .then(r => r.json())
    .then(run => {
      if (run.code_file) {
        fetch('/code/' + runId)
          .then(r => r.text())
          .then(text => { codeContent.textContent = text; })
          .catch(e => { codeContent.textContent = 'Error: ' + e; });
      } else {
        codeContent.textContent = '(no code file)';
      }

      const events = run.events || [];
      if (events.length === 0) {
        eventLog.textContent = '(no events recorded)';
      } else {
        eventLog.textContent = events.map(e =>
          '[' + (e.agent || '?') + '] ' + (e.status || '?') + ' — ' + (e.message || '')
        ).join('\n');
      }
    })
    .catch(e => {
      eventLog.textContent = 'Error loading run: ' + e;
    });
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector('.tab[onclick*="' + name + '"]').classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}
</script>
</body>
</html>
